<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Proyek</title>

    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>

    <main>
        <section id="gallery">
            <h2>Galeri Proyek</h2>

            <div class="gallery">
                <article class="gallery-item">
                    <img src="../assets/images/finvexa.png"
                         alt="Logo Finvexa">
                    <h3>Logo Finvexa</h3>
                </article>

                <article class="gallery-item">
                    <img src="../assets/images/adrian.jpg"
                         alt="Profil Adrian">
                    <h3>Foto Profil</h3>
                </article>

                <article class="gallery-item">
                    <img src="../assets/images/sepatu-badmin.jpg"
                         alt="Sepatu Badminton">
                    <h3>Sepatu Badminton</h3>
                </article>

                <article class="gallery-item">
                    <img src="../assets/images/bermain-badmin.jpg"
                         alt="Bermain Badminton">
                    <h3>Bermain Badminton</h3>
                </article>

                <article class="gallery-item">
                    <img src="../assets/images/sertifikat-financial-literacy.jpg"
                         alt="Sertifikat Financial Literacy">
                    <h3>Sertifikat</h3>
                </article>

                <article class="gallery-item">
                    <img src="../assets/images/portofolio.png"
                         alt="Portofolio">
                    <h3>Portofolio Pribadi</h3>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
